[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjs-literals"
version = "0.1.0"
description = "JavaScript-style object literals for Python"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ipython"]

[project.scripts]
pyjs = "pyjs.cli:main"

[tool.setuptools.packages.find]
include = ["pyjs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
